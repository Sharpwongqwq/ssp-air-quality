function segDist(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;

}

function ramp(t){
  t=Math.max(0,Math.min(1,t));
  var s=[[44,123,182],[86,180,233],[105,219,124],[255,212,59],[255,146,43],[255,77,77]];
  var x=t*(s.length-1), i=Math.floor(x), f=x-i;
  if(i>=s.length-1){i=s.length-2;f=1;}
  var a=s[i],b=s[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
}

/* ============ 預先算影響場（每個污染物一次）============ */
var FIELD = {}, NCACHE = {};
var NFIELD = 130;
function buildField(poll){
  if(FIELD[poll]) return FIELD[poll];
  var L=POLL[poll].L, arr=new Float32Array(NFIELD*NFIELD);
  for(var j=0;j<NFIELD;j++){
    var lat=B.latMax-(B.latMax-B.latMin)*j/(NFIELD-1);
    for(var i=0;i<NFIELD;i++){
      var lng=B.lngMin+(B.lngMax-B.lngMin)*i/(NFIELD-1);
      arr[j*NFIELD+i]=influence(lat,lng,L);
    }
  }
  FIELD[poll]=arr;
  return arr;
}
// 5 級色階（與採樣點圓點一致）—— 按 WHO 比例插值
var LV_STOPS = [
  {r:0.00, c:[122,229,130]},   // 低    < 70%
  {r:0.70, c:[255,209,102]},   // 中    70–100%
  {r:1.00, c:[255,146, 43]},   // 高    100–150%
  {r:1.50, c:[255, 77, 77]},   // 甚高  150–250%
  {r:2.50, c:[177,140,255]}    // 嚴重  > 250%
];
function levelRamp(v, who){
  if(!who || who<=0) who=1;
  var r = v/who;
  if(r <= LV_STOPS[0].r) return LV_STOPS[0].c;
  for(var i=1;i<LV_STOPS.length;i++){
    if(r <= LV_STOPS[i].r){
      var a=LV_STOPS[i-1], b=LV_STOPS[i];
      var t=(r-a.r)/(b.r-a.r);
      return [Math.round(a.c[0]+(b.c[0]-a.c[0])*t),
              Math.round(a.c[1]+(b.c[1]-a.c[1])*t),
              Math.round(a.c[2]+(b.c[2]-a.c[2])*t)];
    }
  }
  return LV_STOPS[LV_STOPS.length-1].c;
}

function buildOverlay(poll,hour){
  var key=poll+'@'+hour;
  if(NCACHE[key]) return NCACHE[key];
  var f=buildField(poll), c=genConc(poll,hour);
  var who=POLL[poll].who;
  var cv=document.createElement('canvas'); cv.width=NFIELD; cv.height=NFIELD;
  var ctx=cv.getContext('2d'), img=ctx.createImageData(NFIELD,NFIELD);
  for(var k=0;k<f.length;k++){
    var v=c.gen+(c.road-c.gen)*f[k];
    var col=levelRamp(v, who);
    var p=k*4;
    img.data[p]=col[0];img.data[p+1]=col[1];img.data[p+2]=col[2];img.data[p+3]=185;
  }
  ctx.putImageData(img,0,0);
  var url=cv.toDataURL();
  NCACHE[key]=url;
  return url;
}

/* ============ Layer 1 ============ */
var L1={poll:'no2',hour:23,overlay:null,roadLayer:null,stationLayer:null,pt:'SSP-01'};

function drawRoads(opacity){
  if(L1.roadLayer) map.removeLayer(L1.roadLayer);
  L1.roadLayer=L.layerGroup().addTo(map);
  var byCls={};
  ROADS.forEach(function(r){
    var w=r.w;
    if(w>=1.4) byCls['mw']=byCls['mw']||[];
    else if(w>=1.2) byCls['pr']=byCls['pr']||[];
    else if(w>=0.9) byCls['se']=byCls['se']||[];
    else if(w>=0.6) byCls['te']=byCls['te']||[];
    else byCls['mn']=byCls['mn']||[];
    var k = w>=1.4?'mw': w>=1.2?'pr': w>=0.9?'se': w>=0.6?'te':'mn';
    byCls[k].push(r);
  });
  var STYLE={
    mw:{c:'#ff2e63',w:3.4,o:0.85}, pr:{c:'#ff922b',w:2.8,o:0.8},
    se:{c:'#ffd166',w:2.0,o:0.7}, te:{c:'#8fa3c8',w:1.4,o:0.55}, mn:{c:'#5a6a85',w:1.0,o:0.4}
  };
  ['mn','te','se','pr','mw'].forEach(function(k){
    if(!byCls[k]) return;
    var s=STYLE[k];
    byCls[k].forEach(function(r){
      var pl=L.polyline(r.p,{color:s.c,weight:s.w,opacity:s.o*(opacity||1)}).addTo(L1.roadLayer);
      if(r.n) pl.bindTooltip(r.n,{sticky:true});
    });
  });
}
// 安全取採樣點數值（O₃ 沒有感測器）
function sensorVal(s, poll, hour){
  if(!s || !s.series) return null;
  var a = s.series[poll];
  if(!a) return null;
  var v = a[hour];
  return (v==null||isNaN(v)) ? null : v;
}

// 空氣質素等級（按 WHO 比例）
function aqLevel(v, who){
  if(v==null || !who) return {n:'無數據', c:'#5a6a85', r:0, i:0};
  var r = v / who;
  if(r < 0.7)  return {n:'低',   c:'#7ae582', r:r, i:1};
  if(r < 1.0)  return {n:'中',   c:'#ffd166', r:r, i:2};
  if(r < 1.5)  return {n:'高',   c:'#ff922b', r:r, i:3};
  if(r < 2.5)  return {n:'甚高', c:'#ff4d4d', r:r, i:4};
  return {n:'嚴重', c:'#b18cff', r:r, i:5};
}

// 找主導道路（貢獻最大的那條）
function dominantRoad(lat, lng, L){
  var best = {f:0, d:0, w:0, name:''};
  for(var r=0;r<ROADS.length;r++){
    var rd=ROADS[r], p=rd.p, ny=111320, nx=111320*Math.cos(lat*Math.PI/180);
    for(var i=0;i<p.length-1;i++){
      var ax=(p[i][1]-lng)*nx, ay=(p[i][0]-lat)*ny;
      var bx=(p[i+1][1]-lng)*nx, by=(p[i+1][0]-lat)*ny;
      var d=segDist(0,0,ax,ay,bx,by);
      var f=rd.w*Math.exp(-d/L);
      if(f>best.f) best={f:f, d:d, w:rd.w, name:rd.n||'(無名)'};
    }
  }
  return best;
}

function drawStations(){
  if(L1.stationLayer) map.removeLayer(L1.stationLayer);
  L1.stationLayer=L.layerGroup().addTo(map);
  var P=POLL[L1.poll];
  var SENS=D.sensors||[];
  var sel = L1.pt;
  SENS.forEach(function(s){
    var v=sensorVal(s,L1.poll,L1.hour);
    var lv=aqLevel(v,P.who);
    var isSel = (s.id===sel);
    var tr = (D.traffic||[]).find(function(t){ return t.id===s.id; });
    var m=L.circleMarker([s.lat,s.lng],{
      radius: isSel?12:9, color: isSel?'#ffd166':'#fff', weight: isSel?3.5:2,
      fillColor: lv.c, fillOpacity:.95
    }).addTo(L1.stationLayer);
    m.bindPopup('<b>'+s.id+'</b><br>'+(s.name||'')+'<br>'+
      '<span style="color:#57606a">'+s.type+'</span><br>'+
      '<hr style="margin:4px 0;border:none;border-top:1px solid #ddd">'+
      P.zh+': <b>'+(v==null?'—':v.toFixed(1))+'</b> µg/m³<br>'+
      '等級: <b style="color:'+lv.c+'">'+lv.n+'</b>'+
      (v!=null?'（WHO 的 '+(lv.r*100).toFixed(0)+'%）':'')+'<br>'+
      '車流: <b>'+(tr?tr.aadt.toLocaleString():'—')+'</b> 輛/日'+
      (tr?'（尖峰 '+tr.peak.toLocaleString()+' 輛/小時）':'')+'<br>'+
      '<span style="color:#9a6700;font-size:10px">⚠ 模擬數據</span>');
    m.bindTooltip('<span style="font:10px ui-monospace,Consolas,monospace">'+
      '<b style="color:'+lv.c+'">'+s.id+'</b> '+
      (v==null?'—':v.toFixed(0))+' µg/m³<br>'+
      '<span style="color:#ffd166">'+(tr?(tr.aadt/1000).toFixed(1)+'k 輛/日':'—')+'</span></span>',
      {direction:'top', permanent:true, className:'trafLabel', offset:[0,-4]});
    m.on('click',function(){ L1.pt=s.id; showHeat(); drawStations(); panelL1(); });
    s._m=m;
  });
}
function showHeat(){
  if(L1.overlay) map.removeLayer(L1.overlay);
  L1.overlay=L.imageOverlay(buildOverlay(L1.poll,L1.hour),
    [[B.latMin,B.lngMin],[B.latMax,B.lngMax]],{opacity:.8,interactive:false}).addTo(map);
}

    h += '<div style="display:flex;gap:4px;margin-top:8px">';
    [{n:'低',c:'#7ae582'},{n:'中',c:'#ffd166'},{n:'高',c:'#ff922b'},{n:'甚高',c:'#ff4d4d'},{n:'嚴重',c:'#b18cff'}].forEach(function(x){
      h += '<span style="flex:1;text-align:center;font-size:9px;padding:2px 0;border-radius:4px;'+

    });
    h += '</div>';
    h += '<div class="kv" style="margin-top:9px"><span class="k">空氣質素等級</span><span class="v" style="color:'+ptColor+'">' + lv.n + '</span></div>';

    h += 'L    = ' + P.L + ' m　<span style="color:#5a6a85">（' + P.zh + ' 衰減長度）</span>';
    h += '<div style="color:#ffd166;font-weight:700;margin:8px 0 4px">② 主導道路</div>';
    h += '最近道路 = ' + dom.name + '<br>';

    h += 'w    = ' + dom.w.toFixed(2) + '　<span style="color:#5a6a85">（道路等級權重）</span>';

    h += 'f = w × e<sup>−d/L</sup><br>';
    h += '  = ' + dom.w.toFixed(2) + ' × e<sup>−' + dom.d.toFixed(1) + '/' + P.L + '</sup><br>';
    h += '  = ' + dom.w.toFixed(2) + ' × ' + Math.exp(-dom.d / P.L).toFixed(3) + '<br>';

    h += 'C = C_bg + (C_rd − C_bg) × f<br>';

    h += '  = <b style="color:#7ae582">' + cModel.toFixed(2) + '</b> µg/m³';
    h += '<div style="color:#ffd166;font-weight:700;margin:8px 0 4px">⑤ 模擬傳感器值</div>';
    if (sv != null) {
      var bias = cModel > 0 ? sv / cModel : 0;
      h += 'C_sensor = C_model × BIAS × 濕度 × (1 + 噪聲)<br>';

      h += '<span style="color:#5a6a85">（BIAS = 點位固定偏差 ±5%）</span>';

    }
    h += '<div style="color:#ffd166;font-weight:700;margin:8px 0 4px">⑥ 等級判定</div>';

    // ===== 車流 vs 空氣質素 =====

        return { id:t.id, aadt:t.aadt, peak:t.peak, v: sensorVal(ss, L1.poll, 23) };
      }).filter(function(p){ return p.v != null; });

      // Pearson
      var n = pairs.length;
      var mx = pairs.reduce(function(a,p){return a+p.aadt;},0)/n;
      var my = pairs.reduce(function(a,p){return a+p.v;},0)/n;
      var sxy=0,sxx=0,syy=0;
      pairs.forEach(function(p){ sxy+=(p.aadt-mx)*(p.v-my); sxx+=Math.pow(p.aadt-mx,2); syy+=Math.pow(p.v-my,2); });
      var r = (sxx>0&&syy>0) ? sxy/Math.sqrt(sxx*syy) : 0;

      h += '<div class="kv"><span class="k">R²（解釋力）</span><span class="v">' + (r*r).toFixed(3) + '</span></div>';
      h += '<div class="kv"><span class="k">迴歸式</span><span class="v" style="font-size:10px">' +
        inter.toFixed(1) + ' + ' + slope.toFixed(5) + '×AADT</span></div>';
      h += '<div class="kv"><span class="k">每萬輛/日</span><span class="v">' + (slope*10000).toFixed(2) + ' µg/m³</span></div>';

         : '⚪ <b>弱相關</b>：車流不是主要因素') + '</div>';
      h += '<div class="note" style="margin-top:5px">⚠️ 車流量為<b>依道路等級估算</b>，非實地調查</div></div>';
    }
  }

  h+='<div class="card"><h2>街頭級模型</h2>'+
    '<div class="kv"><span class="k">背景（一般站均）</span><span class="v" style="color:#6ec6ff">'+c.gen.toFixed(1)+'</span></div>'+

    '<div class="kv"><span class="k">衰減長度 L</span><span class="v">'+P.L+' m</span></div>'+
    '<div class="note" style="margin-top:8px">C = C<sub>背景</sub> + (C<sub>路邊</sub> − C<sub>背景</sub>) × max<sub>r</sub>[ w<sub>r</sub> · e<sup>−d<sub>r</sub>/L</sup> ]<br>'+
    '<b>用 690 段真實 OSM 道路</b>，按等級加權（高速 1.5 → 住宅街 0.45）</div></div>';

  h+='<div class="card"><h2>道路等級</h2><div class="note">'+
    '<span style="color:#ff2e63">▬</span> 快速道路（w 1.5）<br>'+
    '<span style="color:#ff922b">▬</span> 主幹道（w 1.25）<br>'+
    '<span style="color:#ffd166">▬</span> 次幹道（w 1.0）<br>'+
    '<span style="color:#8fa3c8">▬</span> 支路（w 0.7）<br>'+
    '<span style="color:#5a6a85">▬</span> 住宅街（w 0.45）</div></div>';

  // 統一 5 級圖例（熱力圖 + 圓點共用）
  var lo = Math.min(c.gen, c.road), hi = Math.max(c.gen, c.road);

// 車流 vs 濃度 散點圖
function drawScatter(poll){
  var svg = document.getElementById('scatter1');
  if (!svg) return;
  var SENS = D.sensors || [], TRAF = D.traffic || [];
  var P = POLL[poll];
  var pts = TRAF.map(function(t){
    var s = SENS.find(function(x){ return x.id === t.id; });
    var v = sensorVal(s, poll, 23);
    var lv = aqLevel(v, P.who);
    return { id:t.id, x:t.aadt, y:v, c:lv.c, name:s ? s.name : '' };
  }).filter(function(p){ return p.y != null; });
  if (pts.length < 3) { svg.innerHTML = '<text x="180" y="100" fill="#5a6a85" font-size="11" text-anchor="middle">數據不足</text>'; return; }

  var W=360, H=200, PL=40, PR=14, PT=14, PB=30, pw=W-PL-PR, ph=H-PT-PB;
  var xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  var xmn=Math.min.apply(null,xs), xmx=Math.max.apply(null,xs);
  var ymn=Math.min.apply(null,ys), ymx=Math.max.apply(null,ys);
  var xpad=(xmx-xmn)*0.08||1, ypad=(ymx-ymn)*0.12||1;
  xmn-=xpad; xmx+=xpad; ymn-=ypad; ymx+=ypad;
  var X=v=>PL+(v-xmn)/(xmx-xmn)*pw, Y=v=>PT+ph-(v-ymn)/(ymx-ymn)*ph;

  var s='';
  // 網格
  for(var g=0;g<=3;g++){
    var y=PT+ph*g/3;
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#1b2637"/>'+
       '<text x="'+(PL-4)+'" y="'+(y+3)+'" fill="#5a6a85" font-size="7.5" text-anchor="end">'+(ymx-(ymx-ymn)*g/3).toFixed(0)+'</text>';
    var x=PL+pw*g/3;
    s+='<line x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+ph)+'" stroke="#1b2637"/>'+
       '<text x="'+x+'" y="'+(H-14)+'" fill="#5a6a85" font-size="7.5" text-anchor="middle">'+(xmn+(xmx-xmn)*g/3).toFixed(0)+'</text>';
  }
  // WHO 線
  if(P.who>=ymn&&P.who<=ymx){
    s+='<line x1="'+PL+'" y1="'+Y(P.who)+'" x2="'+(W-PR)+'" y2="'+Y(P.who)+'" stroke="#7ae582" stroke-width="1" stroke-dasharray="4 3"/>';
  }
  // 迴歸線
  var n=pts.length;
  var mxx=pts.reduce((a,p)=>a+p.x,0)/n, myy=pts.reduce((a,p)=>a+p.y,0)/n;
  var sxy=0,sxx=0;
  pts.forEach(p=>{sxy+=(p.x-mxx)*(p.y-myy);sxx+=Math.pow(p.x-mxx,2);});
  var b=sxx>0?sxy/sxx:0, a=myy-b*mxx;
  s+='<line x1="'+X(xmn)+'" y1="'+Y(a+b*xmn)+'" x2="'+X(xmx)+'" y2="'+Y(a+b*xmx)+
     '" stroke="#ffd166" stroke-width="1.6" opacity="0.85"/>';
  // 點
  pts.forEach(function(p){
    s+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="5" fill="'+p.c+'" stroke="#fff" stroke-width="1.3"/>';
  });
  // 軸標籤
  s+='<text x="'+(W/2)+'" y="'+(H-2)+'" fill="#6e7d99" font-size="8" text-anchor="middle">AADT（輛/日）</text>';
  s+='<text x="10" y="'+(PT+ph/2)+'" fill="#6e7d99" font-size="8" text-anchor="middle" transform="rotate(-90 10 '+(PT+ph/2)+')">'+P.zh+' µg/m³</text>';
  svg.innerHTML=s;
}

/* ============ Layer 2：真實路網導航 ============ */
var L2={poll:'no2',hour:23,origin:null,dest:null,routeLayer:null};

// 預先算節點濃度快取
var NCONC={};
function nodeConc(poll,hour,i){
  var k=poll+'@'+hour+'@'+i;
  if(NCONC[k]!==undefined) return NCONC[k];
  var n=G.nodes[i];
  var v=streetConc(poll,hour,n[0],n[1]);
  NCONC[k]=v;
  return v;
}
// 鄰接表
var ADJ=null;
function buildAdj(){
  if(ADJ) return ADJ;
  ADJ=G.nodes.map(()=>[]);
  G.edges.forEach(function(e){
    ADJ[e[0]].push({n:e[1],len:e[2]});
    ADJ[e[1]].push({n:e[0],len:e[2]});
  });
  return ADJ;
}
function dijkstra(src,dst,poll,hour,mode){
  var adj=buildAdj(), N=G.nodes.length;
  var dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1), done=new Uint8Array(N);
  dist[src]=0;
  var heap=[[0,src]];
  while(heap.length){
    heap.sort((a,b)=>a[0]-b[0]);
    var top=heap.shift(), d=top[0], u=top[1];
    if(done[u])continue; done[u]=1;
    if(u===dst)break;
    var nc=nodeConc(poll,hour,u);
    for(var k=0;k<adj[u].length;k++){
      var e=adj[u][k];
      if(done[e.n])continue;
      var cost;
      if(mode==='fast') cost=e.len;
      else cost=e.len*Math.max((nc+nodeConc(poll,hour,e.n))/2,1);
      var nd=d+cost;
      if(nd<dist[e.n]){dist[e.n]=nd;prev[e.n]=u;heap.push([nd,e.n]);}
    }
  }
  if(dist[dst]===Infinity)return null;
  var path=[],cur=dst;
  while(cur!==-1){path.push(cur);cur=prev[cur];}
  return path.reverse();
}
function nearestNode(lat,lng){
  var best=-1,bd=Infinity;
  for(var i=0;i<G.nodes.length;i++){
    var d=distM(lat,lng,G.nodes[i][0],G.nodes[i][1]);
    if(d<bd){bd=d;best=i;}
  }
  return {id:best,dist:bd};
}
function pathStats(path,poll,hour){
  var len=0,dose=0;
  for(var i=0;i<path.length-1;i++){
    var a=G.nodes[path[i]], b=G.nodes[path[i+1]];
    var d=distM(a[0],a[1],b[0],b[1]);
    len+=d;
    dose+=d*(nodeConc(poll,hour,path[i])+nodeConc(poll,hour,path[i+1]))/2;
  }
  return {len:len,time:len/1.25/60,dose:dose/1.25};
}

      h+='<div class="card"><h2>計算方式 <span class="sm">演算法</span></h2>';

      h+='節點 N = '+G.nodes.length+'　邊 E = '+G.edges.length+'<br>';
      h+='來源：OpenStreetMap 真實道路<br>';

      h+='　　<span style="color:#5a6a85">= C_bg + (C_rd − C_bg) × f_i</span>';
      h+='<div style="color:#ffd166;font-weight:700;margin-top:7px">③ 邊成本（雙目標）</div>';
      h+='<span style="color:#ff922b">最快</span>：cost = L<sub>ij</sub><br>';
      h+='<span style="color:#7ae582">健康</span>：cost = L<sub>ij</sub> × (C<sub>i</sub>+C<sub>j</sub>)/2';
      h+='<div style="color:#ffd166;font-weight:700;margin-top:7px">④ 尋路</div>';
      h+='Dijkstra 最短路徑（貪心 + 優先隊列）<br>';

      h+='複雜度 O(E log V)';

      h+='Dose = Σ<sub>路段</sub> ( L<sub>i</sub> × C<sub>i</sub> ) ÷ v<br>';
      h+='v = '+V+' m/s（步行速度）<br>';
      h+='單位：µg/m³ × s = µg·s/m³（濃度 × 停留秒數）';

        '因為劑量 ∝ 濃度 × 時間，而時間 ∝ 距離（速度固定）<br>'+

      // ===== 路徑明細 =====

var L3={poll:'pm25', t:23};
function fitAR1(s){
  var xs=[],ys=[];
  for(var t=0;t<s.length-1;t++){ if(s[t]==null||s[t+1]==null)continue; xs.push(s[t]);ys.push(s[t+1]); }
  var n=xs.length;
  var mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  var sxy=0,sxx=0;
  for(var i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx);}
  var b=sxx>0?sxy/sxx:0, a=my-b*mx, sse=0,sseP=0;
  for(var j=0;j<n;j++){sse+=Math.pow(ys[j]-(a+b*xs[j]),2);sseP+=Math.pow(ys[j]-xs[j],2);}
  return {a:a,b:b,rmse:Math.sqrt(sse/n),rmseP:Math.sqrt(sseP/n),n:n};
}

// 取某時間點的值（0-23 觀測，24-29 預報 +1..+6）
function valueAt(ser,m,t){
  if(t<=23) return {v:ser[t],kind:'obs',t:t};
  var last=null,lastIdx=-1;
  for(var i=23;i>=0;i--) if(ser[i]!=null){ last=ser[i]; lastIdx=i; break; }
  if(last==null) return {v:null,kind:'fc',t:t};
  var k=t-23, v=last;
  for(var i2=0;i2<k;i2++) v = m.a + m.b*v;
  // 預報變異數（AR(1)）：Var = σ²(1-φ^{2k})/(1-φ²)
  var sd=0;
  if(Math.abs(m.b)<1){
    var varK = m.rmse*m.rmse*(1-Math.pow(m.b,2*k))/(1-m.b*m.b);
    sd = Math.sqrt(Math.max(0,varK));
  } else {
    sd = m.rmse*Math.sqrt(k);
  }
  return {v:v,kind:'fc',t:t,k:k,sd:sd,lo:v-1.96*sd,hi:v+1.96*sd,from:lastIdx};
}

function drawChart3(ser,m,P){
  var svg=document.getElementById('chart3'); if(!svg)return;
  var W=360,H=160,PL=36,PR=10,PT=14,PB=24,pw=W-PL-PR,ph=H-PT-PB;
  // 計算預報點
  var fcs=[];
  for(var k=1;k<=6;k++) fcs.push(valueAt(ser,m,23+k));
  var vals=ser.filter(v=>v!=null).concat(fcs.map(f=>f.v));
  var mn=Math.min.apply(null,vals.concat([P.who||0])), mx=Math.max.apply(null,vals);
  var pad=Math.max((mx-mn)*0.12,0.5); mn-=pad; mx+=pad;
  var n=24+6;
  var X=i=>PL+i/(n-1)*pw, Y=v=>PT+ph-(v-mn)/(mx-mn)*ph;
  var s='';
  // 網格
  for(var g=0;g<=3;g++){
    var y=PT+ph*g/3;
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#1b2637"/>'+
       '<text x="'+(PL-4)+'" y="'+(y+3)+'" fill="#5a6a85" font-size="8" text-anchor="end">'+(mx-(mx-mn)*g/3).toFixed(1)+'</text>';
  }
  // WHO 線
  if(P.who>=mn&&P.who<=mx){
    s+='<line x1="'+PL+'" y1="'+Y(P.who)+'" x2="'+(W-PR)+'" y2="'+Y(P.who)+'" stroke="#7ae582" stroke-width="1.2" stroke-dasharray="5 3"/>'+
       '<text x="'+(W-PR)+'" y="'+(Y(P.who)-3)+'" fill="#7ae582" font-size="8" text-anchor="end">WHO '+P.who+'</text>';
  }
  // AQO 線
  if(P.aqo>=mn&&P.aqo<=mx){
    s+='<line x1="'+PL+'" y1="'+Y(P.aqo)+'" x2="'+(W-PR)+'" y2="'+Y(P.aqo)+'" stroke="#ff4d4d" stroke-width="1.2" stroke-dasharray="5 3"/>';
  }
  // 現在分隔線
  s+='<line x1="'+X(23)+'" y1="'+PT+'" x2="'+X(23)+'" y2="'+(PT+ph)+'" stroke="#ffd166" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<text x="'+(X(23)+3)+'" y="'+(PT+9)+'" fill="#ffd166" font-size="8">現在</text>';
  // 持續性基準
  var lastV=null;
  for(var i=23;i>=0;i--) if(ser[i]!=null){lastV=ser[i];break;}
  if(lastV!=null){
    var pp=[];
    for(var i2=0;i2<=23;i2++) if(ser[i2]!=null) pp.push(X(i2).toFixed(1)+','+Y(ser[i2]).toFixed(1));
    for(var k2=1;k2<=6;k2++) pp.push(X(23+k2).toFixed(1)+','+Y(lastV).toFixed(1));
    s+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="#8fa3c8" stroke-width="1.1" stroke-dasharray="4 3"/>';
  }
  // 實測
  var obs=[];
  for(var i3=0;i3<=23;i3++) if(ser[i3]!=null) obs.push(X(i3).toFixed(1)+','+Y(ser[i3]).toFixed(1));
  s+='<polyline points="'+obs.join(' ')+'" fill="none" stroke="#6ec6ff" stroke-width="2"/>';
  // 預報 + 區間帶
  var fcPts=[];
  if(lastV!=null) fcPts.push(X(23).toFixed(1)+','+Y(lastV).toFixed(1));
  fcs.forEach(function(f,k2){ if(f.v!=null) fcPts.push(X(24+k2).toFixed(1)+','+Y(f.v).toFixed(1)); });
  // 區間帶
  var band=[];
  fcs.forEach(function(f,k2){ if(f.v!=null&&f.sd>0) band.push([24+k2,Math.max(mn,f.lo),Math.min(mx,f.hi)]); });
  if(band.length){
    var up=band.map(b=>X(b[0]).toFixed(1)+','+Y(b[2]).toFixed(1));
    var dn=band.slice().reverse().map(b=>X(b[0]).toFixed(1)+','+Y(b[1]).toFixed(1));
    s+='<polygon points="'+up.concat(dn).join(' ')+'" fill="#ffd166" opacity="0.15"/>';
  }
  s+='<polyline points="'+fcPts.join(' ')+'" fill="none" stroke="#ffd166" stroke-width="2"/>';
  // 游標
  var sel=valueAt(ser,m,L3.t);
  if(sel.v!=null){
    var cx=X(L3.t), cy=Y(sel.v);
    s+='<line x1="'+cx+'" y1="'+PT+'" x2="'+cx+'" y2="'+(PT+ph)+'" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+(sel.kind==='obs'?'#6ec6ff':'#ffd166')+'" stroke="#fff" stroke-width="1.5"/>';
  }
  // X 軸
  s+='<text x="'+PL+'" y="'+(H-6)+'" fill="#5a6a85" font-size="8">00:30</text>';
  s+='<text x="'+X(23)+'" y="'+(H-6)+'" fill="#ffd166" font-size="8" text-anchor="middle">23:30</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-6)+'" fill="#ffd166" font-size="8" text-anchor="end">+6h</text>';
  svg.innerHTML=s;
}

/* ============ 採樣點網絡（模擬資料）============ */
var SENS = D.sensors || [];
var S0 = { poll:'no2', hour:23, layer:null };

function renderS0(){
  clearOverlays();
  showHeat(); if(L1.overlay)L1.overlay.setOpacity(0.22);
  drawRoads(0.3);

  if(S0.layer) map.removeLayer(S0.layer);
  S0.layer = L.layerGroup().addTo(map);

  SENS.forEach(function(s){
    var isBg = /背景/.test(s.type);
    var col = isBg ? '#7ae582' : '#ff4d4d';
    var v = sensorVal(s,S0.poll,S0.hour);
    var rad = isBg ? 8 : 11;

    var mk = L.circleMarker([s.lat,s.lng], {
      radius: rad, color:'#fff', weight:2.5,
      fillColor: col, fillOpacity:.95
    }).addTo(S0.layer);

    mk.bindPopup(
      '<b>'+s.id+' '+s.name+'</b><br>'+
      '<span style="color:#57606a">'+s.type+'</span><br>'+
      '<hr style="margin:5px 0;border:none;border-top:1px solid #ddd">'+
      'NO₂: <b>'+s.series.no2[S0.hour]+'</b> µg/m³<br>'+
      'PM2.5: <b>'+s.series.pm25[S0.hour]+'</b> µg/m³<br>'+
      'PM10: <b>'+s.series.pm10[S0.hour]+'</b> µg/m³<br>'+
      '風速: <b>'+s.series.ws[S0.hour]+'</b> m/s　風向: <b>'+s.series.wd[S0.hour]+'</b>°<br>'+
      '<span style="color:#9a6700;font-size:10px">⚠ 模擬數據（未實地採集）</span>'
    );
    mk.bindTooltip(s.id+' '+s.name, { direction:'top' });
    s._m = mk;

    // 風向箭頭
    var wd = s.series.wd[S0.hour];
    var ws = s.series.ws[S0.hour];
    var len = Math.min(0.00055, ws*0.00014);
    var rad2 = (270 - wd) * Math.PI/180;   // 氣象風向 = 風來的方向
    var lat2 = s.lat + Math.cos(rad2)*len;
    var lng2 = s.lng + Math.sin(rad2)*len;
    L.polyline([[s.lat,s.lng],[lat2,lng2]], { color:'#6ec6ff', weight:2, opacity:.75 }).addTo(S0.layer);
  });

  panelS0();
  map.fitBounds([[B.latMin,B.lngMin],[B.latMax,B.lngMax]], {padding:[30,30]});
}

function panelS0(){
  var P = POLL[S0.poll];
  var vals = SENS.map(function(s){ return sensorVal(s,S0.poll,S0.hour); }).filter(function(x){ return x!=null; });
  var mn = vals.length ? Math.min.apply(null, vals) : 0;
  var mx = vals.length ? Math.max.apply(null, vals) : 0;
  var ratio = mn>0 ? mx/mn : 0;
  var bgPts = SENS.filter(function(s){ return /背景/.test(s.type); });
  var rdPts = SENS.filter(function(s){ return !/背景/.test(s.type); });
  var kAvg = function(arr, key){
    if(!arr.length) return 0;
    return arr.reduce(function(a,s){ return a + (sensorVal(s,key,S0.hour)||0); },0)/arr.length;
  };

  var h = '';
  h += '<div class="card" style="border-color:#6b4a05;background:#1a1508">'+
    '<h2 style="color:#ffd166">⚠️ 模擬數據</h2>'+
    '<div style="font-size:11px;color:#ffe0a3;line-height:1.65">'+
    '這 <b>12 個採樣點</b> 是本專案<b>計劃部署的位置</b>，'+
    '目前顯示的數值全部是<b>模型推算 + 隨機擾動</b>生成的<b>模擬數據</b>，'+
    '<b>尚未實地採集</b>。<br><br>'+
    '用途：① 驗證系統架構 ② 規劃採樣設計 ③ 估算預期數值範圍<br>'+
    '實地採集後，把真值填入 <b>SSP_sampling_template.csv</b> 即可替換。</div></div>';

  h += '<div class="card"><h2>污染物</h2><div class="seg" id="s0Poll">'+
    Object.keys(POLL).map(function(k){ return '<button data-p="'+k+'"'+(k===S0.poll?' class="on"':'')+'>'+POLL[k].zh+'</button>'; }).join('')+
    '</div><div class="sl"><span class="lb">時間</span><input type="range" id="s0Hour" min="0" max="23" value="'+S0.hour+'">'+
    '<span class="vv" id="s0HourV">'+String(S0.hour).padStart(2,'0')+':30</span></div></div>';

  h += '<div class="card"><h2>12 個採樣點</h2>'+
    '<div class="kv"><span class="k">路邊點</span><span class="v">'+rdPts.length+' 個</span></div>'+
    '<div class="kv"><span class="k">背景點</span><span class="v" style="color:#7ae582">'+bgPts.length+' 個</span></div>'+
    '<div class="kv"><span class="k">最高／最低</span><span class="v" style="color:#ff922b">'+ratio.toFixed(2)+'×</span></div>'+
    '<div class="note" style="margin-top:7px">最高 <b>'+mx.toFixed(1)+'</b>　最低 <b>'+mn.toFixed(1)+'</b>　'+P.zh+'</div></div>';

  h += '<div class="card"><h2>路邊 vs 背景（模擬）</h2>'+
    '<div class="kv"><span class="k">路邊點平均 NO₂</span><span class="v" style="color:#ff922b">'+kAvg(rdPts,'no2').toFixed(1)+'</span></div>'+
    '<div class="kv"><span class="k">背景點平均 NO₂</span><span class="v" style="color:#7ae582">'+kAvg(bgPts,'no2').toFixed(1)+'</span></div>'+
    '<div class="kv"><span class="k">路邊／背景</span><span class="v">'+(kAvg(bgPts,'no2')>0?(kAvg(rdPts,'no2')/kAvg(bgPts,'no2')).toFixed(2):'—')+'×</span></div>'+
    '<div class="note" style="margin-top:7px">路邊點平均 PM2.5 '+kAvg(rdPts,'pm25').toFixed(1)+
    '　背景點 '+kAvg(bgPts,'pm25').toFixed(1)+'</div></div>';

  h += '<div class="card"><h2>採樣點清單</h2><table>'+
    '<tr><th>ID</th><th>位置</th><th style="text-align:right">'+P.zh+'</th></tr>';
  SENS.slice().sort(function(a,b){ return (sensorVal(b,S0.poll,S0.hour)||0)-(sensorVal(a,S0.poll,S0.hour)||0); })
    .forEach(function(s){
      var bg = /背景/.test(s.type);
      var sv = sensorVal(s,S0.poll,S0.hour);
      h += '<tr><td style="font-size:10px;color:'+(bg?'#7ae582':'#ff922b')+'">'+s.id+'</td>'+
        '<td style="font-size:11px">'+s.name+'</td>'+
        '<td class="n" style="color:'+(bg?'#7ae582':'#cfd9f2')+'">'+(sv==null?'—':sv.toFixed(1))+'</td></tr>';
    });
  h += '</table></div>';

  h += '<div class="card"><h2>採樣設計要點</h2><div class="note">'+
    '<b>① 路邊點（10 個）</b><br>'+
    '主幹道路口 5 個（長沙灣道、荔枝角道、青山道、大埔道、元州街）<br>'+
    '次幹道路口 3 個（南昌街、通州街、大埔道）<br>'+
    '內街 2 個（基隆街、海壇街）<br><br>'+
    '<b>② 背景點（2 個）</b><br>'+
    '深水埗公園、石硤尾邨 —— 用來估計區域背景值<br><br>'+
    '<b>③ 每點測量</b><br>'+
    'NO₂、PM2.5、PM10、風速、風向、溫度、濕度</div></div>';

  h += '<div class="card"><h2>配套檔案</h2><div class="note">'+
    '<b>SSP_sampling_template.csv</b><br>'+
    '12 點空模板，實地填寫用<br><br>'+
    '<b>SSP_sampling_points.geojson</b><br>'+
    '12 點坐標，可匯入 ArcGIS / GPS<br><br>'+
    '<b>SSP_sensors_SIMULATED.csv</b><br>'+
    '目前顯示的模擬數據（12 點 × 24 小時）</div></div>';

  h += '<div class="card"><h2>限制</h2><div class="warn">'+
    '① <b>全部數值為模擬</b>，不可當作實測引用<br>'+
    '② 風速風向為<b>區域性假設</b>（10 月偏東風）<br>'+
    '③ 點的坐標為<b>建議位置</b>，需實地確認可達性<br>'+
    '④ 感測器類型與校正方式尚未確定</div></div>';

  document.getElementById('panel').innerHTML = h;
  document.getElementById('s0Poll').onclick = function(e){
    var b=e.target.closest('button'); if(!b)return;
    S0.poll=b.getAttribute('data-p'); renderS0();
  };
  document.getElementById('s0Hour').oninput = function(){
    S0.hour=+this.value;
    document.getElementById('s0HourV').textContent=String(S0.hour).padStart(2,'0')+':30';
    renderS0();
  };
}

/* ============ 渲染 ============ */
function clearOverlays(){
  if(L1.overlay){map.removeLayer(L1.overlay);L1.overlay=null;}
  if(L1.stationLayer){map.removeLayer(L1.stationLayer);L1.stationLayer=null;}
  if(L1.roadLayer){map.removeLayer(L1.roadLayer);L1.roadLayer=null;}
  if(L2.routeLayer){map.removeLayer(L2.routeLayer);L2.routeLayer=null;}
  if(L3LAYER){map.removeLayer(L3LAYER);L3LAYER=null;}
}
function renderL1(){
  clearOverlays();
  showHeat(); drawRoads(1); drawStations(); panelL1();
  map.setView([22.3330,114.1595],16);
}
function renderL2(){
  clearOverlays();
  showHeat(); if(L1.overlay)L1.overlay.setOpacity(0.32);
  drawRoads(0.55);
  panelL2();
  map.setView([22.3330,114.1595],16);
}
function renderL3(){
  clearOverlays();
  L3LAYER=L.layerGroup().addTo(map);
  var g=L3LAYER;
  // 12 個採樣點（淡顯，不再有 EPD 站）
  (D.sensors||[]).forEach(function(s){
    var isBg=/背景/.test(s.type);
    L.circleMarker([s.lat,s.lng],{radius:isBg?4:5,color:'#fff',weight:1,
      fillColor:isBg?'#7ae582':'#ff4d4d',fillOpacity:.55})
      .addTo(g).bindTooltip(s.id,{direction:'top'});
  });
  panelL3();
  map.fitBounds([[B.latMin,B.lngMin],[B.latMax,B.lngMax]],{padding:[30,30]});
}

/* ============ 事件 ============ */
var CUR='1';
var L3LAYER=null;
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');
    CUR=this.getAttribute('data-t');
    if(CUR==='1')renderL1();else if(CUR==='2')renderL2();else if(CUR==='3')renderL3();else renderS0();
  };
});
map.on('click',function(e){
  if(CUR!=='2')return;
  if(!L2.origin||(L2.origin&&L2.dest)){L2.origin={lat:e.latlng.lat,lng:e.latlng.lng};L2.dest=null;}
  else L2.dest={lat:e.latlng.lat,lng:e.latlng.lng};
  panelL2();
});

renderL1();
</script>
