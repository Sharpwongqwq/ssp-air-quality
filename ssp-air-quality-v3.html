  if(arr.length){ arr.sort(function(a,b){return a-b;}); HBmed = arr[Math.floor(arr.length/2)]; }
})();
var HBDELTA = null, HBDKEY = "";
function hbDelta(){
  var key = L1.poll + '@' + L1.hour + '@' + HB.K;
  if(HBDELTA && HBDKEY === key) return HBDELTA;
  var L = POLL[L1.poll].L, c = genConc(L1.poll, L1.hour);
  var cur = HB.on, N = 16, sum = 0, mx = 0, cnt = 0;
  for(var j=0;j<N;j++){
    var lat = B.latMax-(B.latMax-B.latMin)*j/(N-1);
    for(var i=0;i<N;i++){
      var lng = B.lngMin+(B.lngMax-B.lngMin)*i/(N-1);
      HB.on = false; var f0 = influence(lat,lng,L);
      HB.on = true;  var f1 = influence(lat,lng,L);
      var d = Math.abs((c.road-c.gen)*(f1-f0));
      sum += d; if(d>mx) mx=d; cnt++;
    }
  }
  HB.on = cur;
  HBDELTA = { mean: sum/cnt, max: mx };
  HBDKEY = key;
  return HBDELTA;
}
/* ===== 風速模組（wind-speed dilution factor）===== */
var WIND = { key: 'off', u: 2.0, uref: 2.0 };
var WIND_MODE = {
  off:     { u: 2.0, zh: '不計',   en: 'Off' },
  calm:    { u: 1.0, zh: '靜風',   en: 'Calm 1 m/s' },
  typical: { u: 3.0, zh: '典型',   en: 'Typical 3 m/s' },
  strong:  { u: 6.0, zh: '強風',   en: 'Strong 6 m/s' }
};
function windFactor(){
  if(WIND.key === 'off') return 1;
  var u = Math.max(0.8, WIND.u);
  var r = WIND.uref / u;
  if(r < 0.50) r = 0.50;
  if(r > 1.80) r = 1.80;
  return r;
}
function hbLeff(rd, L){
  if(!HB.on || rd.h==null) return L;
  var hf = 1 + HB.K * (rd.h / HB.Href - 1);
  if(hf < 0.60) hf = 0.60;
  if(hf > 2.20) hf = 2.20;
  return L * hf;
}

/* ============ 幾何 ============ */
function segDist(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  var t = L2===0?0:((px-ax)*dx+(py-ay)*dy)/L2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function distM(lat1,lng1,lat2,lng2){
  var dy=(lat2-lat1)*111320, dx=(lng2-lng1)*111320*Math.cos((lat1+lat2)/2*Math.PI/180);
  return Math.hypot(dx,dy);
}
// 加權道路影響 0..1（對每條道路取最大貢獻）
/* 道路段空間索引：只檢查點附近的線段（原本 690 段全掃 → 約 1/10） */
var RIDX = null;
function buildRoadIndex(){
  if(RIDX) return RIDX;
  var cell = 0.0012;                 // ≈ 133 m
  var idx = {}, maxSeg = 0;
  for(var r=0;r<ROADS.length;r++){
    var p = ROADS[r].p;
    for(var i=0;i<p.length-1;i++){
      var la1=p[i][0], lo1=p[i][1], la2=p[i+1][0], lo2=p[i+1][1];
      var k0=Math.floor(Math.min(la1,la2)/cell), k1=Math.floor(Math.max(la1,la2)/cell);
      var j0=Math.floor(Math.min(lo1,lo2)/cell), j1=Math.floor(Math.max(lo1,lo2)/cell);
      for(var a=k0;a<=k1;a++) for(var b=j0;b<=j1;b++){
        var key=a+'|'+b;
        (idx[key] || (idx[key]=[])).push(r, i);
      }
      maxSeg++;
    }
  }
  RIDX = { cell: cell, idx: idx, nseg: maxSeg };
  return RIDX;
}

/* 幾何影響場（不含風速，風速在繪圖與查詢時乘） */
function influence(lat,lng,L){
  var best=0, R=buildRoadIndex(), cell=R.cell;
  var c0=Math.floor(lat/cell), d0=Math.floor(lng/cell);
  var ny=111320, nx=111320*Math.cos(lat*Math.PI/180);
  for(var a=c0-2;a<=c0+2;a++){
    for(var b=d0-2;b<=d0+2;b++){
      var arr=R.idx[a+'|'+b];
      if(!arr) continue;
      for(var k=0;k<arr.length;k+=2){
        var rd=ROADS[arr[k]], p=rd.p, i=arr[k+1];
        var Le=hbLeff(rd,L);
        var ax=(p[i][1]-lng)*nx, ay=(p[i][0]-lat)*ny;
        var bx=(p[i+1][1]-lng)*nx, by=(p[i+1][0]-lat)*ny;
        var d=segDist(0,0,ax,ay,bx,by);
        var c=rd.w*Math.exp(-d/Le);
        if(c>best) best=c;
      }
    }
  }
  return Math.min(1,best);
}

/* 含風速的查詢（供採樣點 / 導航 / 讀數使用） */
function influenceWF(lat,lng,L){ return Math.min(1, influence(lat,lng,L)*windFactor()); }

/* ============ 濃度 ============ */
function genConc(poll,hour){
  var g=[],rd=[];
  ST.forEach(function(s){
    var v=s[poll][hour];
    if(v==null||isNaN(v))return;
    if(s.type==='roadside')rd.push(v);else g.push(v);
  });
  var m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  var genH=m(g), roadH=m(rd);

  // 啟用 8 點標定：用標定值當基準，但按該小時相對 24 小時平均的比例縮放
  if(USE_CAL && D.calibration && D.calibration[poll]){
    var cal = D.calibration[poll];
    var gm = mean24(poll,false), rm = mean24(poll,true);
    var fg = (gm>0 && genH>0)  ? genH/gm  : 1;
    var fr = (rm>0 && roadH>0) ? roadH/rm : 1;
    return {gen: cal.C_bg*fg, road: cal.C_rd*fr, cal: true, fg:fg, fr:fr};
  }
  return {gen: genH, road: roadH, cal: false};
}

/* 24 小時平均（背景 / 路邊），用來算每小時相對比例 */
var _M24 = {};
function mean24(poll, roadside){
  var key = poll + (roadside?'_r':'_g');
  if(_M24[key] !== undefined) return _M24[key];
  var sum=0, n=0;
  ST.forEach(function(s){
    if((s.type==='roadside') !== roadside) return;
    var arr = s[poll] || [];
    arr.forEach(function(v){ if(v!=null && !isNaN(v)){ sum+=v; n++; } });
  });
  _M24[key] = n ? sum/n : 0;
  return _M24[key];
}
function streetConc(poll,hour,lat,lng){
  var c=genConc(poll,hour);
  var f=influenceWF(lat,lng,POLL[poll].L);
  return c.gen+(c.road-c.gen)*f;
}

/* ============ 色階 ============ */
function ramp(t){
  t=Math.max(0,Math.min(1,t));
  var s=[[44,123,182],[86,180,233],[105,219,124],[255,212,59],[255,146,43],[255,77,77]];
  var x=t*(s.length-1), i=Math.floor(x), f=x-i;
  if(i>=s.length-1){i=s.length-2;f=1;}
  var a=s[i],b=s[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
}

/* ============ 預先算影響場（每個污染物一次）============ */
var FIELD = {}, NCACHE = {}, COVMASK = null;
var NFIELD = 200;
function buildField(poll){
  var ck = poll + (HB.on?'_hb':'');
  if(FIELD[ck]) return FIELD[ck];
  var L=POLL[poll].L, N=NFIELD, arr=new Float32Array(N*N);
  for(var j=0;j<N;j++){
    var lat=B.latMax-(B.latMax-B.latMin)*j/(N-1);
    for(var i=0;i<N;i++){
      var lng=B.lngMin+(B.lngMax-B.lngMin)*i/(N-1);
      arr[j*N+i]=influence(lat,lng,L);
    }
  }
  // ── 3x3 平滑兩遍：讓濃度從路邊往外平滑衰減，不出現硬邊 ──
  var pass1=new Float32Array(N*N);
  for(var y=0;y<N;y++) for(var x=0;x<N;x++){
    var sum=0,cnt=0;
    for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
      var yy=y+dy, xx=x+dx;
      if(yy<0||yy>=N||xx<0||xx>=N) continue;
      sum+=arr[yy*N+xx]; cnt++;
    }
    pass1[y*N+x]=sum/cnt;
  }
  var pass2=new Float32Array(N*N);
  for(var y2=0;y2<N;y2++) for(var x2=0;x2<N;x2++){
    var sum2=0,cnt2=0;
    for(var dy2=-1;dy2<=1;dy2++) for(var dx2=-1;dx2<=1;dx2++){
      var yy2=y2+dy2, xx2=x2+dx2;
      if(yy2<0||yy2>=N||xx2<0||xx2>=N) continue;
      sum2+=pass1[yy2*N+xx2]; cnt2++;
    }
    pass2[y2*N+x2]=sum2/cnt2;
  }
  FIELD[ck]=pass2;
  return pass2;
}
// 5 級色階（與採樣點圓點一致）—— 按 WHO 比例插值
/* 5 級離散色階 —— 不做插值，每個等級一個固定顏色（邊界清楚） */
var LV_COLOR = [
  [ 34,197, 94],   // 0 低     < 70%   綠
  [234,179,  8],   // 1 中     70–100% 黃
  [249,115, 22],   // 2 高     100–150% 橙
  [220, 38, 38],   // 3 甚高   150–250% 紅
  [124, 58,237]    // 4 嚴重   > 250%  紫
];
var LV_EDGE = [
  [ 21,128, 61],   // 各級的深色描邊
  [161,120,  0],
  [180, 70,  9],
  [153, 27, 27],
  [ 76, 29,149]
];
var LV_LIMIT = [0.70, 1.00, 1.50, 2.50];

function levelIndex(v, who){
  if(!who || who<=0) who=1;
  var r = v/who;
  for(var i=0;i<LV_LIMIT.length;i++) if(r < LV_LIMIT[i]) return i;
  return 4;
}
function levelRamp(v, who){
  return LV_COLOR[levelIndex(v, who)];
}

/* 測點覆蓋半徑：超出此距離視為「無測點覆蓋」 */
var COV_R = 600;
function getCovMask(){
  if(COVMASK) return COVMASK;
  var N=NFIELD, m=new Uint8Array(N*N), SENS=D.sensors||[];
  for(var j=0;j<N;j++){
    var lat=B.latMax-(B.latMax-B.latMin)*j/(N-1);
    for(var i=0;i<N;i++){
      var lng=B.lngMin+(B.lngMax-B.lngMin)*i/(N-1);
      var best=1e9;
      for(var k=0;k<SENS.length;k++){
        var d=distM(lat,lng,SENS[k].lat,SENS[k].lng);
        if(d<best) best=d;
      }
      m[j*N+i] = best<=COV_R ? 1 : 0;
    }
  }
  COVMASK=m;
  return m;
}

function buildOverlay(poll,hour){
  var key=poll+'@'+hour;
  if(NCACHE[key]) return NCACHE[key];
  var f=buildField(poll), c=genConc(poll,hour), wf=windFactor();
  var who=POLL[poll].who;
  var N=NFIELD, cv=document.createElement('canvas'); cv.width=N; cv.height=N;
  var ctx=cv.getContext('2d'), img=ctx.createImageData(N,N);

  // 第一趟：每個像素算出等級索引
  var lv = new Uint8Array(N*N);
  for(var k=0;k<f.length;k++){
    lv[k] = levelIndex(c.gen+(c.road-c.gen)*f[k]*wf, who);
  }

  // 第二趟：上色，等級交界處畫深色描邊
  var cov = getCovMask();
  for(var k2=0;k2<f.length;k2++){
    // 超出測點覆蓋範圍 → 透明（不顯示）
    if(!cov[k2]){
      var pz = k2*4;
      img.data[pz]=0; img.data[pz+1]=0; img.data[pz+2]=0; img.data[pz+3]=0;
      continue;
    }
    var idx = lv[k2];
    var x = k2 % N, y = (k2 - x) / N;
    var edge = false;
    if(x>0     && lv[k2-1] !== idx) edge = true;
    if(x<N-1   && lv[k2+1] !== idx) edge = true;
    if(y>0     && lv[k2-N] !== idx) edge = true;
    if(y<N-1   && lv[k2+N] !== idx) edge = true;

    var base = LV_COLOR[idx];
    var col = base;
    if (edge) {
      // 邊界只微暗 15%，不再用深色硬描邊
      col = [Math.round(base[0]*0.82), Math.round(base[1]*0.82), Math.round(base[2]*0.82)];
    }
    var p = k2*4;
    img.data[p]   = col[0];
    img.data[p+1] = col[1];
    img.data[p+2] = col[2];
    img.data[p+3] = edge ? 225 : 205;
  }
  ctx.putImageData(img,0,0);
  var url=cv.toDataURL();
  NCACHE[key]=url;
  return url;
}

// 空氣質素等級（按 WHO 比例）
function aqLevel(v, who){
  if(v==null || !who) return {n:'無數據', c:'#5a6a85', r:0, i:0};
  var r = v / who;
  if(r < 0.7)  return {n:'低',   c:'#22c55e', r:r, i:1};
  if(r < 1.0)  return {n:'中',   c:'#eab308', r:r, i:2};
  if(r < 1.5)  return {n:'高',   c:'#f97316', r:r, i:3};
  if(r < 2.5)  return {n:'甚高', c:'#dc2626', r:r, i:4};
  return {n:'嚴重', c:'#7c3aed', r:r, i:5};
}

// 找主導道路（貢獻最大的那條）
function dominantRoad(lat, lng, L){
  var best = {f:0, d:0, w:0, name:''};
  for(var r=0;r<ROADS.length;r++){
    var rd=ROADS[r], p=rd.p, ny=111320, nx=111320*Math.cos(lat*Math.PI/180);
    for(var i=0;i<p.length-1;i++){
      var ax=(p[i][1]-lng)*nx, ay=(p[i][0]-lat)*ny;
      var bx=(p[i+1][1]-lng)*nx, by=(p[i+1][0]-lat)*ny;
      var d=segDist(0,0,ax,ay,bx,by);
      var f=rd.w*Math.exp(-d/L);
      if(f>best.f) best={f:f, d:d, w:rd.w, name:rd.n||'(無名)'};
    }
  }
  return best;
}

var L2={poll:'no2',hour:23,origin:null,dest:null,routeLayer:null};

// 預先算節點濃度快取
var NCONC={};
function nodeConc(poll,hour,i){
  var k=poll+'@'+hour+'@'+i;
  if(NCONC[k]!==undefined) return NCONC[k];
  var n=G.nodes[i];
  var v=streetConc(poll,hour,n[0],n[1]);
  NCONC[k]=v;
  return v;
}
// 鄰接表
var ADJ=null;
function buildAdj(){
  if(ADJ) return ADJ;
  ADJ=G.nodes.map(()=>[]);
  G.edges.forEach(function(e){
    ADJ[e[0]].push({n:e[1],len:e[2]});
    ADJ[e[1]].push({n:e[0],len:e[2]});
  });
  return ADJ;
}
function dijkstra(src,dst,poll,hour,mode){
  var adj=buildAdj(), N=G.nodes.length;
  var dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1), done=new Uint8Array(N);
  dist[src]=0;
  var heap=[[0,src]];
  while(heap.length){
    heap.sort((a,b)=>a[0]-b[0]);
    var top=heap.shift(), d=top[0], u=top[1];
    if(done[u])continue; done[u]=1;
    if(u===dst)break;
    var nc=nodeConc(poll,hour,u);
    for(var k=0;k<adj[u].length;k++){
      var e=adj[u][k];
      if(done[e.n])continue;
      var cost;
      if(mode==='fast') cost=e.len;
      else cost=e.len*Math.max((nc+nodeConc(poll,hour,e.n))/2,1);
      var nd=d+cost;
      if(nd<dist[e.n]){dist[e.n]=nd;prev[e.n]=u;heap.push([nd,e.n]);}
    }
  }
  if(dist[dst]===Infinity)return null;
  var path=[],cur=dst;
  while(cur!==-1){path.push(cur);cur=prev[cur];}
  return path.reverse();
}
function nearestNode(lat,lng){
  var best=-1,bd=Infinity;
  for(var i=0;i<G.nodes.length;i++){
    var d=distM(lat,lng,G.nodes[i][0],G.nodes[i][1]);
    if(d<bd){bd=d;best=i;}
  }
  return {id:best,dist:bd};
}
function pathStats(path,poll,hour){
  var len=0,dose=0;
  for(var i=0;i<path.length-1;i++){
    var a=G.nodes[path[i]], b=G.nodes[path[i+1]];
    var d=distM(a[0],a[1],b[0],b[1]);
    len+=d;
    dose+=d*(nodeConc(poll,hour,path[i])+nodeConc(poll,hour,path[i+1]))/2;
  }
  return {len:len,time:len/1.25/60,dose:dose/1.25};
}

var L3={poll:'pm25', t:24, pt:'A1'};
function fitAR1(s){
  var xs=[],ys=[];
  for(var t=0;t<s.length-1;t++){ if(s[t]==null||s[t+1]==null)continue; xs.push(s[t]);ys.push(s[t+1]); }
  var n=xs.length;
  var mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  var sxy=0,sxx=0;
  for(var i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx);}
  var b=sxx>0?sxy/sxx:0, a=my-b*mx, sse=0,sseP=0;
  for(var j=0;j<n;j++){sse+=Math.pow(ys[j]-(a+b*xs[j]),2);sseP+=Math.pow(ys[j]-xs[j],2);}
  return {a:a,b:b,rmse:Math.sqrt(sse/n),rmseP:Math.sqrt(sseP/n),n:n};
}

// 取某時間點的值（0-23 觀測，24-29 預報 +1..+6）
function valueAt(ser,m,t){
  if(t<=23) return {v:ser[t],kind:'obs',t:t};
  var last=null,lastIdx=-1;
  for(var i=23;i>=0;i--) if(ser[i]!=null){ last=ser[i]; lastIdx=i; break; }
  if(last==null) return {v:null,kind:'fc',t:t};
  var k=t-23, v=last;
  for(var i2=0;i2<k;i2++) v = m.a + m.b*v;
  // 預報變異數（AR(1)）：Var = σ²(1-φ^{2k})/(1-φ²)
  var sd=0;
  if(Math.abs(m.b)<1){
    var varK = m.rmse*m.rmse*(1-Math.pow(m.b,2*k))/(1-m.b*m.b);
    sd = Math.sqrt(Math.max(0,varK));
  } else {
    sd = m.rmse*Math.sqrt(k);
  }
  return {v:v,kind:'fc',t:t,k:k,sd:sd,lo:v-1.96*sd,hi:v+1.96*sd,from:lastIdx};
}

function drawChart3(ser,m,P){
  var svg=document.getElementById('chart3'); if(!svg)return;
  var W=360,H=160,PL=36,PR=10,PT=14,PB=24,pw=W-PL-PR,ph=H-PT-PB;
  // 計算預報點
  var fcs=[];
  for(var k=1;k<=6;k++) fcs.push(valueAt(ser,m,23+k));
  var vals=ser.filter(v=>v!=null).concat(fcs.map(f=>f.v));
  var mn=Math.min.apply(null,vals.concat([P.who||0])), mx=Math.max.apply(null,vals);
  var pad=Math.max((mx-mn)*0.12,0.5); mn-=pad; mx+=pad;
  var n=24+6;
  var X=i=>PL+i/(n-1)*pw, Y=v=>PT+ph-(v-mn)/(mx-mn)*ph;
  var s='';
  // 網格
  for(var g=0;g<=3;g++){
    var y=PT+ph*g/3;
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#1b2637"/>'+
       '<text x="'+(PL-4)+'" y="'+(y+3)+'" fill="#5a6a85" font-size="8" text-anchor="end">'+(mx-(mx-mn)*g/3).toFixed(1)+'</text>';
  }
  // WHO 線
  if(P.who>=mn&&P.who<=mx){
    s+='<line x1="'+PL+'" y1="'+Y(P.who)+'" x2="'+(W-PR)+'" y2="'+Y(P.who)+'" stroke="#7ae582" stroke-width="1.2" stroke-dasharray="5 3"/>'+
       '<text x="'+(W-PR)+'" y="'+(Y(P.who)-3)+'" fill="#7ae582" font-size="8" text-anchor="end">WHO '+P.who+'</text>';
  }
  // AQO 線
  if(P.aqo>=mn&&P.aqo<=mx){
    s+='<line x1="'+PL+'" y1="'+Y(P.aqo)+'" x2="'+(W-PR)+'" y2="'+Y(P.aqo)+'" stroke="#ff4d4d" stroke-width="1.2" stroke-dasharray="5 3"/>';
  }
  // 現在分隔線
  s+='<line x1="'+X(23)+'" y1="'+PT+'" x2="'+X(23)+'" y2="'+(PT+ph)+'" stroke="#ffd166" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<text x="'+(X(23)+3)+'" y="'+(PT+9)+'" fill="#ffd166" font-size="8">現在</text>';
  // 持續性基準
  var lastV=null;
  for(var i=23;i>=0;i--) if(ser[i]!=null){lastV=ser[i];break;}
  if(lastV!=null){
    var pp=[];
    for(var i2=0;i2<=23;i2++) if(ser[i2]!=null) pp.push(X(i2).toFixed(1)+','+Y(ser[i2]).toFixed(1));
    for(var k2=1;k2<=6;k2++) pp.push(X(23+k2).toFixed(1)+','+Y(lastV).toFixed(1));
    s+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="#8fa3c8" stroke-width="1.1" stroke-dasharray="4 3"/>';
  }
  // 實測
  var obs=[];
  for(var i3=0;i3<=23;i3++) if(ser[i3]!=null) obs.push(X(i3).toFixed(1)+','+Y(ser[i3]).toFixed(1));
  s+='<polyline points="'+obs.join(' ')+'" fill="none" stroke="#6ec6ff" stroke-width="2"/>';
  // 預報 + 區間帶
  var fcPts=[];
  if(lastV!=null) fcPts.push(X(23).toFixed(1)+','+Y(lastV).toFixed(1));
  fcs.forEach(function(f,k2){ if(f.v!=null) fcPts.push(X(24+k2).toFixed(1)+','+Y(f.v).toFixed(1)); });
  // 區間帶
  var band=[];
  fcs.forEach(function(f,k2){ if(f.v!=null&&f.sd>0) band.push([24+k2,Math.max(mn,f.lo),Math.min(mx,f.hi)]); });
  if(band.length){
    var up=band.map(b=>X(b[0]).toFixed(1)+','+Y(b[2]).toFixed(1));
    var dn=band.slice().reverse().map(b=>X(b[0]).toFixed(1)+','+Y(b[1]).toFixed(1));
    s+='<polygon points="'+up.concat(dn).join(' ')+'" fill="#ffd166" opacity="0.15"/>';
  }
  s+='<polyline points="'+fcPts.join(' ')+'" fill="none" stroke="#ffd166" stroke-width="2"/>';
  // 游標
  var sel=valueAt(ser,m,L3.t);
  if(sel.v!=null){
    var cx=X(L3.t), cy=Y(sel.v);
    s+='<line x1="'+cx+'" y1="'+PT+'" x2="'+cx+'" y2="'+(PT+ph)+'" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+(sel.kind==='obs'?'#6ec6ff':'#ffd166')+'" stroke="#fff" stroke-width="1.5"/>';
  }
  // X 軸
  s+='<text x="'+PL+'" y="'+(H-6)+'" fill="#5a6a85" font-size="8">00:30</text>';
  s+='<text x="'+X(23)+'" y="'+(H-6)+'" fill="#ffd166" font-size="8" text-anchor="middle">23:30</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-6)+'" fill="#ffd166" font-size="8" text-anchor="end">+6h</text>';
  svg.innerHTML=s;
}

/* 連續色階：綠 → 黃 → 橙 → 紅 → 紫 */
function d8Ramp(v, lo, hi) {
  var t = hi > lo ? (v - lo) / (hi - lo) : 0;
  t = Math.max(0, Math.min(1, t));
  var stops = [[34,197,94],[234,179,8],[249,115,22],[220,38,38],[124,58,237]];
  var x = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  var a = stops[i], b = stops[i + 1];
  return "rgb(" + Math.round(a[0]+(b[0]-a[0])*f) + "," + Math.round(a[1]+(b[1]-a[1])*f) + "," + Math.round(a[2]+(b[2]-a[2])*f) + ")";
}

function d8Vals() {
  var p = D8STATE.period, q = D8STATE.poll;
  return D8.points.map(function (x) { return { id: x.id, name: x.name, type: x.type, v: x[p][q] }; });
}

function drawD8() {

  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  D8.points.forEach(function (pt) {
    var row = vals.find(function (x) { return x.id === pt.id; });
    var col = d8Ramp(row.v, lo, hi);
    L.circleMarker([pt.lat, pt.lng], {
      radius: 12, color: "#fff", weight: 2.5, fillColor: col, fillOpacity: 0.95, interactive: false
    }).addTo(D8LAYER);
    L.marker([pt.lat, pt.lng], { icon: L.divIcon({ className: "", html: "<div style=\"width:0;height:0\"></div>", iconSize: [0,0] }) })
      .addTo(D8LAYER).bindTooltip(pt.id + " · " + row.v.toFixed(1), { permanent: true, direction: "top", offset: [0,-12] });
  });
}

  var vals = d8Vals().sort(function (a, b) { return b.v - a.v; });
  var vs = vals.map(function (x) { return x.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var over = vals.filter(function (x) { return x.v > P.who; }).length;
  var overAqo = vals.filter(function (x) { return x.v > P.aqo; }).length;
  var h = "";

  /* ── 警示 ── */
  h += '<div class="card"><h2>8 點數據 <span class="sm">3 時段</span></h2>';
  h += '<div class="note">8 個測量點 · 3 個時段 · 每時段 13 次讀數</div>';
  h += '</div>';

  /* ── 選擇器 ── */
  h += '<div class="card"><h2>時段</h2><div class="seg" id="d8Per" style="margin-bottom:0">';
  D8PERIODS.forEach(function (x) {
    h += '<button data-p="' + x.k + '"' + (D8STATE.period === x.k ? ' class="on"' : '') + '>' + x.zh + '</button>';
  });
  h += '</div></div>';

  h += '<div class="card"><h2>污染物</h2><div class="seg" id="d8Poll" style="margin-bottom:0">';
  D8POLLS.forEach(function (x, i) {
    h += '<button data-p="' + i + '"' + (D8STATE.poll === i ? ' class="on"' : '') + '>' + x.n + '</button>';
  });
  h += '</div></div>';

  /* ── 排名 ── */
  h += '<div class="card"><h2>' + P.n + ' 排名 <span class="sm">' + per.n + '</span></h2>';
  h += '<div style="font-size:10px;color:#8797bd;margin-bottom:6px">最高 ' + hi.toFixed(1) + ' · 最低 ' + lo.toFixed(1) + ' · 差距 ' + (hi/lo).toFixed(2) + 'x</div>';
  vals.forEach(function (x, i) {
    var w = hi > 0 ? (x.v / hi * 100) : 0;
    var col = d8Ramp(x.v, lo, hi);
    var flag = x.v > P.aqo ? " 🔴" : x.v > P.who ? " 🟡" : "";
    h += '<div style="margin:5px 0">';
    h += '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:#c8d4e8">';
    h += '<span>' + (i+1) + '. <b style="color:#6ec6ff">' + x.id + '</b> ' + x.name + flag + '</span>';
    h += '<span style="font-family:monospace;font-weight:700;color:' + col + '">' + x.v.toFixed(1) + '</span>';
    h += '</div>';
    h += '<div class="bar" style="margin-top:2px"><i style="width:' + w + '%;background:' + col + '"></i></div>';
    h += '</div>';
  });
  h += '</div>';

  /* ── 超標 ── */
  h += '<div class="card"><h2>超標 <span class="sm">' + per.n + '</span></h2>';
  h += '<div class="kv"><span class="k">超 WHO (' + P.who + ')</span><span class="v" style="color:' + (over>0?"#f87171":"#22c55e") + '">' + over + ' / 8</span></div>';
  h += '<div class="kv"><span class="k">超 HK AQO (' + P.aqo + ')</span><span class="v" style="color:' + (overAqo>0?"#f87171":"#22c55e") + '">' + overAqo + ' / 8</span></div>';
  h += '<div class="note" style="margin-top:7px;font-size:10.5px">' + (over>=7 ? "幾乎全部點超 WHO" : over>=4 ? "部分點超 WHO" : "少數點超 WHO") + '，但仍遠低於本地 AQO</div></div>';

  /* ── 三時段對比 ── */
  h += '<div class="card"><h2>三時段對比</h2>';
  h += '<div style="font-size:10px;color:#8797bd;margin-bottom:6px">Evening / Afternoon 倍數</div>';
  h += '<table><tr><th>點</th><th style="text-align:right">上午</th><th style="text-align:right">下午</th><th style="text-align:right">傍晚</th><th style="text-align:right">晚/午</th></tr>';
  D8.points.forEach(function (pt) {
    var q = D8STATE.poll;
    var r = pt.e[q] / pt.a[q];
    h += '<tr><td style="font-family:monospace;color:#6ec6ff;font-weight:700">' + pt.id + '</td>';
    h += '<td class="n">' + pt.m[q].toFixed(1) + '</td>';
    h += '<td class="n">' + pt.a[q].toFixed(1) + '</td>';
    h += '<td class="n" style="color:#fff;font-weight:700">' + pt.e[q].toFixed(1) + '</td>';
    h += '<td class="n" style="color:' + (r>1.3?"#f87171":"#8797bd") + '">' + r.toFixed(2) + 'x</td></tr>';
  });
  h += '</table></div>';

  /* ── 關鍵發現 ── */
  h += '<div class="card"><h2>關鍵發現</h2><div class="note" style="font-size:10.5px;line-height:1.7">';
  h += '<b>① 排名三段一致</b><br>A1 路邊 > C1 天橋 > A3/A2 街道 > B1 醫院 > B2/B3 學校 > A4 公園<br><br>';
  h += '<b>② 傍晚最高、下午最低</b><br>NO2 晚/午 = 1.40x，PM2.5 只有 1.23x<br>→ NO2 對交通更敏感<br><br>';
  h += '<b>③ NO2 梯度最陡</b><br>A1/A4：NO2 3.2x，PM2.5 1.8x<br>→ 路邊 NO2 衰減比 PM 快得多<br><br>';
  h += '<b>④ 本地達標、國際超標</b><br>PM2.5 超 WHO 5-7/8，超 AQO 0/8<br>NO2 超 WHO 7-8/8，超 AQO 0/8';
  h += '</div></div>';

  document.getElementById("panel").innerHTML = h;

  /* 綁事件 */
  var pe = document.getElementById("d8Per");
  if (pe) pe.onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    D8STATE.period = b.getAttribute("data-p");
    drawD8(); panelD();
  };
  var po = document.getElementById("d8Poll");
  if (po) po.onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    D8STATE.poll = +b.getAttribute("data-p");
    drawD8(); panelD();
  };
}

function renderD() {
  clearOverlays();
  map.getContainer().style.cursor = "";
  D8LAYER = L.layerGroup().addTo(map);
  drawD8();
  panelD();
  map.setView([22.3320, 114.1586], 16);
}
</script>

  var KEYS = Object.keys(DICT).sort(function(a,b){ return b.length - a.length; });

  /* ── 1. 編譯成單一正規表達式（一次比對，取代 476 次 indexOf）── */
  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  var RE = null;
  try { RE = new RegExp(KEYS.map(esc).join("|"), "g"); } catch(e){ RE = null; }

  var CN = /[\u4e00-\u9fff]/;

  /* ── 2. 安全存取 localStorage ── */
  function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }

  var LANG = lsGet("ssp_lang") || "zh";
  var busy = false;

  function trText(s){
    if (!s) return s;
    if (!CN.test(s)) return s;                 // 沒有中文 → 直接跳過（最快）
    if (RE) {
      var out = s.replace(RE, function(mm){ return DICT[mm] !== undefined ? DICT[mm] : mm; });
      return out.replace(/(\d+)\s*個/g, "$1");
    }
    for (var i=0;i<KEYS.length;i++){
      var k = KEYS[i];
      if (s.indexOf(k) !== -1) s = s.split(k).join(DICT[k]);
    }
    return s.replace(/(\d+)\s*個/g, "$1");
  }

  /* ── 3. 只走「新增的節點」，不是整棵樹 ── */
  function walk(n){
    if (!n) return;
    if (n.nodeType === 3){
      var cur = n.nodeValue;
      if (n.__zh === undefined || cur !== n.__tr) n.__zh = cur;   // 文字被換過 → 重新記原文
      var want = trText(n.__zh);
      if (n.nodeValue !== want) n.nodeValue = want;
      n.__tr = want;
      return;
    }
    if (n.nodeType !== 1) return;
    var tag = n.tagName;
    if (tag === "SCRIPT" || tag === "STYLE") return;
    for (var i = n.childNodes.length - 1; i >= 0; i--) walk(n.childNodes[i]);
  }

  function revert(n){
    if (!n) return;
    if (n.nodeType === 3){
      if (n.__zh !== undefined && n.nodeValue !== n.__zh) n.nodeValue = n.__zh;
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
    for (var i = n.childNodes.length - 1; i >= 0; i--) revert(n.childNodes[i]);
  }

  /* ── 4. 批次處理（rAF 節流，避免每個 mutation 都跑一次）── */
  var queue = [], scheduled = false;
  function flush(){
    scheduled = false;
    if (LANG !== "en" || busy) { queue.length = 0; return; }
    busy = true;
    var nodes = queue.slice(); queue.length = 0;
    for (var i = 0; i < nodes.length; i++) { try { walk(nodes[i]); } catch(e){} }
    busy = false;
  }
  function schedule(){
    if (scheduled) return;
    scheduled = true;
    (window.requestAnimationFrame || function(f){ setTimeout(f, 16); })(flush);
  }

  function setBtn(){
    var b = document.getElementById("langBtn");
    if (b) b.textContent = (LANG === "en") ? "中文" : "EN";
  }

  /* ── 5. 切換：只在切換時才走全樹 ── */
  function toggle(){
    LANG = (LANG === "en") ? "zh" : "en";
    lsSet("ssp_lang", LANG);
    busy = true;
    try {
      if (LANG === "en") walk(document.body);
      else revert(document.body);
    } catch(e){}
    busy = false;
    setBtn();
    try { document.documentElement.lang = (LANG === "en") ? "en" : "zh-Hant"; } catch(e){}
  }

  function init(){
    var hrow = document.querySelector(".hrow");
    if (hrow && !document.getElementById("langBtn")){
      var btn = document.createElement("button");
      btn.id = "langBtn";
      btn.textContent = (LANG === "en") ? "中文" : "EN";
      btn.title = "Switch language / 切換語言";
      btn.style.cssText = "padding:5px 12px;border-radius:7px;border:1px solid #22314a;" +
        "background:#131d2e;color:#6ec6ff;font:700 11px/1.4 inherit;cursor:pointer;" +
        "letter-spacing:.5px;font-family:inherit;margin-left:10px";
      btn.onmouseenter = function(){ btn.style.background = "#1b2a42"; };
      btn.onmouseleave = function(){ btn.style.background = "#131d2e"; };
      btn.onclick = toggle;
      var s = hrow.querySelector(".src");
      if (s) hrow.insertBefore(btn, s); else hrow.appendChild(btn);
    }

    /* 初始：只有英文模式才翻譯 */
    if (LANG === "en") { busy = true; try { walk(document.body); } catch(e){} busy = false; }
    setBtn();

    /* 監聽：只在 panel 與 header 內，且只在英文模式才啟用 */
    var target = document.body;
    try {
      var mo = new MutationObserver(function(muts){
        if (LANG !== "en") return;
        for (var i = 0; i < muts.length; i++){
          var add = muts[i].addedNodes;
          for (var j = 0; j < add.length; j++) queue.push(add[j]);
        }
        if (queue.length) schedule();
      });
      mo.observe(target, { childList:true, subtree:true });   // 不再監聽 characterData
    } catch(e){}
  }

  /* 對外暴露：讓地圖控制項等非 #panel 區域也能即時翻譯 */
  window.__dshTr = function(node){
    if (LANG !== "en" || !node) return;
    busy = true;
    try { walk(node); } catch(e){}
    busy = false;
  };
  window.__dshLang = function(){ return LANG; };

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", init);
  else init();
})();
